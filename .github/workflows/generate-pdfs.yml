name: Generate case-study PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps and logo
        run: |
          python -m pip install -r requirements.txt
          mkdir -p assets
          if [ ! -s assets/sgt-logo.png ]; then
            curl -fsSL -o assets/sgt-logo.png \
              https://raw.githubusercontent.com/HKTITAN/DBMS-Lab/main/assets/sgt-logo.png
          fi
      - name: Build PDFs
        run: |
          python harshit-khemani/generate_case_study.py
          python kush-ahuja/generate_case_study.py
      - name: Commit PDFs and logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sgt-logo.png \
            harshit-khemani/Blockchain_Security_Technology_vs_Human_Error.pdf \
            kush-ahuja/Blockchain_and_the_Cost_of_Regulatory_Compliance.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Commit generated Blockchain Policy case-study PDFs"
            git push
          fi
